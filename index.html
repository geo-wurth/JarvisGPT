<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis GPT</title>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="img/SENAI-AI 1.png" type="image/png">
</head>
<body class="dark-mode">
    <main>
        <!-- Sidebar agora oculta em telas muito pequenas (mobile) para melhor responsividade -->
        <div class="sidebar d-none d-md-block shadow-sm"></div>
        
        <section class="chat position-relative">
            <!-- Botão para alternar o modo -->
            <button id="toggle-mode" class="btn position-absolute top-0 end-0 m-3 m-md-4 rounded-circle shadow-sm d-flex align-items-center justify-content-center" title="Alternar Tema">
                <i class="fas fa-sun"></i>
            </button>

            <!-- Cabeçalho (Será removido via JS após a primeira interação) -->
            <img src="img/SENAI-AI 1.png" alt="Jarvis" class="logo-img mb-3">
            <h1 class="title-text fw-bold mb-4 text-center">SENAI GPT</h1>
            
            <!-- Container para a resposta -->
            <div id="resposta" class="resposta chat-container w-100 px-3 px-md-5 mx-auto"></div>

            <!-- Área da Pergunta -->
            <div class="pergunta w-100 px-3 d-flex flex-column align-items-center">
                <!-- Input estilizado em pílula -->
                <div class="input-container d-flex align-items-center p-2 rounded-pill shadow-sm">
                    <input type="text" name="prompt" id="prompt" class="form-control border-0 bg-transparent shadow-none ms-3" placeholder="Pergunte algo ao Jarvis..." autocomplete="off">
                    <div class="buttons d-flex gap-2 me-2">
                        <button id="capture" class="btn btn-custom rounded-circle d-flex align-items-center justify-content-center" type="button" title="Usar microfone">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <button id="send" class="btn btn-custom rounded-circle d-flex align-items-center justify-content-center" type="button" title="Enviar">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

                <!-- Seletores de Configuração -->
                <div class="d-flex justify-content-center flex-wrap gap-3 mt-3">
                    
                    <!-- Seletor de IA -->
                    <div id="IAs" class="provider-selector d-flex p-1 rounded-pill shadow-sm">
                        <div class="provider-option">
                            <input class="form-check-input d-none" type="checkbox" id="switchChatGPT" checked>
                            <label class="provider-label m-0" for="switchChatGPT">
                                <i class="fa-solid fa-robot me-2"></i>ChatGPT
                            </label>
                        </div>
                        <div class="provider-option">
                            <input class="form-check-input d-none" type="checkbox" id="switchGemini">
                            <label class="provider-label m-0" for="switchGemini">
                                <i class="fa-solid fa-wand-magic-sparkles me-2"></i>Gemini
                            </label>
                        </div>
                    </div>

                    <!-- Seletor de Modo de Voz -->
                    <div class="provider-selector d-flex p-1 rounded-pill shadow-sm">
                        <div class="provider-option">
                            <input class="form-check-input d-none" type="radio" name="voiceMode" id="voiceContinuous" checked>
                            <label class="provider-label m-0" for="voiceContinuous">
                                <i class="fa-solid fa-ear-listen me-2"></i>Contínuo
                            </label>
                        </div>
                        <div class="provider-option">
                            <input class="form-check-input d-none" type="radio" name="voiceMode" id="voiceManual">
                            <label class="provider-label m-0" for="voiceManual">
                                <i class="fa-solid fa-hand-pointer me-2"></i>Manual
                            </label>
                        </div>
                    </div>

                </div>
            </div>
            
            <!-- Logo Footer -->
            <img src="img/senai_logo.png" alt="Logo do SENAI" class="senai-footer-logo position-absolute bottom-0 start-0 m-4 opacity-25 d-none d-md-block">
        </section>
    </main>

    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scripts Principais -->
    <script src="scripts/config.js"></script>
    <script src="scripts/messages.js"></script>
    <script src="scripts/tema.js"></script>
    <script src="scripts/voice.js"></script>
    <script src="scripts/ui.js"></script>

    <!-- Providers -->
    <script src="scripts/chatgpt.js"></script>
    <script src="scripts/gemini.js"></script>

    <!-- Inicialização -->
    <script src="scripts/index.js"></script>
</body>
</html>
